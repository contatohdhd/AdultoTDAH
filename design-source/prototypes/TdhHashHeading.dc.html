<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isH2 }}" hint-placeholder-val="{{ true }}"><h2 id="{{ anchor }}" style="margin:0;font:600 {{ size }}/1.25 Inter,sans-serif;letter-spacing:-0.01em;color:#111111;scroll-margin-top:96px;text-wrap:balance"><span aria-hidden="true" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;color:#6E6E73">#</span> {{ text }}</h2></sc-if>
<sc-if value="{{ isH3 }}" hint-placeholder-val="{{ false }}"><h3 id="{{ anchor }}" style="margin:0;font:600 {{ size }}/1.3 Inter,sans-serif;color:#111111;scroll-margin-top:96px"><span aria-hidden="true" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;color:#6E6E73">#</span> {{ text }}</h3></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:70},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contexto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[2,3],&quot;default&quot;:2,&quot;tsType&quot;:&quot;2|3&quot;},&quot;anchor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lv = this.props.level ?? 2;
    return { text: this.props.text ?? 'Contexto', anchor: this.props.anchor ?? '', isH2: lv == 2, isH3: lv == 3, size: lv == 2 ? '23px' : '19px' };
  }
}
</script>
</body>
</html>
